---
- name: Check whether swap file exists
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_file

- name: Create swap file
  ansible.builtin.command:
    argv:
      - /usr/bin/fallocate
      - -l
      - "{{ swap_file_size }}"
      - "{{ swap_file_path }}"
  when: not swap_file.stat.exists

- name: Enforce swap file ownership and permissions
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Check whether swap signature exists
  ansible.builtin.command:
    argv:
      - /usr/sbin/blkid
      - -t
      - TYPE=swap
      - -o
      - device
      - "{{ swap_file_path }}"
  register: swap_signature
  changed_when: false
  failed_when: swap_signature.rc not in [0, 2]

- name: Initialize swap signature
  ansible.builtin.command:
    argv:
      - /usr/sbin/mkswap
      - "{{ swap_file_path }}"
  when: swap_signature.rc == 2

- name: Ensure persistent swap entry exists
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap_file_path }} none swap sw 0 0"
    regexp: "^{{ swap_file_path | regex_escape }}\\s+none\\s+swap\\s+sw\\s+0\\s+0$"
    state: present

- name: Check whether swap file is active
  ansible.builtin.command:
    argv:
      - /usr/sbin/swapon
      - --show=NAME
      - --noheadings
  register: active_swap
  changed_when: false

- name: Activate swap file
  ansible.builtin.command:
    argv:
      - /usr/sbin/swapon
      - "{{ swap_file_path }}"
  when: swap_file_path not in active_swap.stdout_lines

- name: Update APT cache and install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure /etc/localtime
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Configure /etc/timezone
  ansible.builtin.copy:
    content: "{{ timezone }}\n"
    dest: /etc/timezone
    mode: "0644"
