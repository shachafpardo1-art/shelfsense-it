apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: shelfsense
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/part-of: shelfsense-it
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-shelfsense-deployer
  namespace: shelfsense
rules:
  # Helm release metadata and chart-owned application configuration.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # The chart owns the namespaced PostgreSQL claim; the PV remains external.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  # Rollout checks, diagnostics, and local service port-forward smoke tests.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-shelfsense-deployer
  namespace: shelfsense
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: shelfsense
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-shelfsense-deployer
