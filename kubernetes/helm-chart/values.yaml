image:
  repository: postgres
  # Pin the reviewed Debian variant so the UID/GID 999 storage contract is stable.
  tag: "16.14-trixie"
  pullPolicy: IfNotPresent

database:
  name: shelfsense_it
  username: shelfsense_user
  service:
    name: db
    port: 5432
  auth:
    password: ""

postgres:
  replicaCount: 1
  persistence:
    pvName: shelfsense-postgres-pv
    claimName: shelfsense-postgres-pvc
    hostPath: /srv/shelfsense/postgres
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
    reclaimPolicy: Retain
    filesystemGroup: 999
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6


backend:
  replicaCount: 2

  image:
    repository: shachafpardo/shelfsense-backend
    tag: "0.2.0"
    pullPolicy: IfNotPresent

  service:
    name: shelfsense-backend
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  readinessProbe:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  livenessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

migration:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  databaseWait:
    maxAttempts: 30
    retrySeconds: 5

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

frontend:
  replicaCount: 1

  image:
    repository: shachafpardo/shelfsense-frontend
    tag: "0.2.0"
    pullPolicy: IfNotPresent

  service:
    name: shelfsense-frontend
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  livenessProbe:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

ingress:
  enabled: true
  className: traefik
  # Leave empty to accept requests addressed directly to the node's public IP.
  host: ""
  annotations: {}
