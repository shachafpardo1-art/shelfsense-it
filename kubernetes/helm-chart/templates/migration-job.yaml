apiVersion: batch/v1
kind: Job

metadata:
  name: {{ .Release.Name }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shelfsense.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}

  template:
    metadata:
      labels:
        {{- include "shelfsense.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration

    spec:
      restartPolicy: OnFailure

      containers:
        - name: migration
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          command:
            - sh
            - -c
            - alembic upgrade head && python -m scripts.seed_items

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelfsense.backend.secretName" . }}
                  key: DATABASE_URL

          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}