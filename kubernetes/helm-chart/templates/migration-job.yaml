apiVersion: batch/v1
kind: Job

metadata:
  name: {{ .Release.Name }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shelfsense.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}

  template:
    metadata:
      labels:
        {{- include "shelfsense.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration

    spec:
      restartPolicy: OnFailure

      containers:
        - name: migration
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          command:
            - sh
            - -c
            - |
              set -eu

              attempt=1
              max_attempts={{ .Values.migration.databaseWait.maxAttempts }}
              retry_seconds={{ .Values.migration.databaseWait.retrySeconds }}

              while ! python -c 'import os; from sqlalchemy import create_engine; engine = create_engine(os.environ["DATABASE_URL"]); connection = engine.connect(); connection.close(); engine.dispose()'; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "PostgreSQL did not become available after ${max_attempts} attempts; aborting migration." >&2
                  exit 1
                fi

                echo "PostgreSQL unavailable (attempt ${attempt}/${max_attempts}); retrying in ${retry_seconds}s..."
                attempt=$((attempt + 1))
                sleep "$retry_seconds"
              done

              echo "PostgreSQL is available; applying migrations."
              alembic upgrade head
              echo "Migrations complete; seeding inventory items."
              python -m scripts.seed_items

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelfsense.backend.secretName" . }}
                  key: DATABASE_URL

          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
